<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Roda da Sorte Arcade - Street Fighter" />
    <title>🎮 Roda Arcade</title>

    <!-- FONTE PIXELADA -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- ============================================
    SCANLINE (EFEITO DE TV)
    ============================================ -->
    <div class="scanline"></div>

    <!-- ============================================
    FUNDO ARCADE
    ============================================ -->
    <div class="bg-arcade"></div>

    <!-- ============================================
    MENU SUPERIOR (ARCADE)
    ============================================ -->
    <header class="header-arcade">
        <div class="container">
            <div class="header-content">
                <a href="../../abas/projetos.html" class="btn-voltar-arcade">← VOLTAR</a>
                <h1 class="title-arcade">⚡ RODA ARCADE ⚡</h1>
                <span class="version-arcade">v1.0</span>
            </div>
        </div>
    </header>

    <!-- ============================================
    CONTEÚDO PRINCIPAL
    ============================================ -->
    <main class="main-arcade">
        <div class="container">

            <!-- CONTROLE DE SOM E MOEDAS -->
            <div class="sound-control-arcade">
                <button id="soundToggle" class="btn-sound-arcade">
                    🔊 <span id="soundStatus">LIGADO</span>
                </button>
                <div class="coin-counter">
                    <span class="coin-icon">🪙</span>
                    <span class="coin-label">CRÉDITOS:</span>
                    <span id="coinCounter" class="coin-value">0</span>
                </div>
            </div>

            <!-- TEMA (STREET FIGHTER) -->
            <div class="theme-area-arcade">
                <div class="theme-display-arcade">
                    <span class="theme-label-arcade">🎯 TEMA:</span>
                    <span class="theme-text-arcade" id="currentTheme">STREET FIGHTER</span>
                </div>
            </div>

            <!-- ADICIONAR ITENS -->
            <div class="controls-arcade">
                <input type="text" id="itemInput" placeholder="DIGITE UMA OPÇÃO..." maxlength="20" />
                <button class="btn-arcade btn-add-arcade" id="addItemBtn">+ ADICIONAR</button>
            </div>

            <!-- LISTA DE ITENS -->
            <ul class="item-list-arcade" id="itemList"></ul>

            <!-- ROLETA COM BORDA DE LUZES -->
            <div class="roleta-wrapper-arcade">
                <div class="roleta-border" id="roletaBorder">
                    <div class="roleta" id="roleta">
                        <!-- PONTEIRO ESTILIZADO -->
                        <div class="roleta-ponteiro-arcade">▼</div>
                        <!-- CENTRO DA ROLETA -->
                        <div class="roleta-center-arcade" id="roletaCenter">⚡</div>
                        <!-- FATIAS DA ROLETA -->
                        <div class="roleta-fatias" id="roletaFatias"></div>
                    </div>
                </div>
            </div>

            <!-- BOTÕES DE AÇÃO (ESTILO ARCADE) -->
            <div class="actions-arcade">
                <button class="btn-arcade btn-spin-arcade" id="spinBtn">🎮 GIRAR</button>
                <button class="btn-arcade btn-clear-arcade" id="clearBtn">🗑️ LIMPAR</button>
            </div>

            <!-- RESULTADO (ESTILO ARCADE) -->
            <div class="result-arcade" id="resultArea">
                <span class="empty-message-arcade">► ADICIONE ITENS E GIRE ◄</span>
            </div>

            <!-- HISTÓRICO -->
            <div class="historico-arcade" id="historicoArea">
                <h3>📜 HISTÓRICO</h3>
                <ul id="historicoList">
                    <li class="empty-message-arcade">NENHUM SORTEIO AINDA.</li>
                </ul>
            </div>

        </div>
    </main>

    <!-- ============================================
    RODAPÉ ARCADE
    ============================================ -->
    <footer class="footer-arcade">
        <div class="container">
            <p>© 2026 CARLOS · RODA ARCADE</p>
            <p class="footer-credits-arcade">⚡ STREET FIGHTER EDITION ⚡</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
