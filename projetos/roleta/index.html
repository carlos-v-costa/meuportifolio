<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Roda da Sorte — Decisão Rápida" />
    <title>🎡 Roda da Sorte</title>

    <!-- CSS EXCLUSIVO DA ROLETA -->
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
</head>
<body>

    <!-- ============================================
    FUNDO
    ============================================ -->
    <div class="gradient-bg"></div>

    <!-- ============================================
    MENU SIMPLES (APENAS VOLTAR)
    ============================================ -->
    <nav class="navbar-simples">
        <div class="container nav-container">
            <a href="../../abas/projetos.html" class="btn-voltar">
                <i class="fas fa-arrow-left"></i> Voltar aos Projetos
            </a>
            <span class="logo">🎡 Roda da Sorte</span>
        </div>
    </nav>

    <!-- ============================================
    ROLETA
    ============================================ -->
    <section class="section" id="roleta">
        <div class="container">
            <div class="roleta-container">

                <h1 class="page-title"><span>🎡 Roda da Sorte</span></h1>
                <p class="roleta-subtitle">Adicione opções, gire e deixe a sorte decidir!</p>

                <!-- CONTROLE DE SOM -->
                <div class="sound-toggle">
                    <label for="soundToggle">🔊 Sons</label>
                    <input type="checkbox" id="soundToggle" checked />
                </div>

                <!-- ROLETA VISUAL -->
                <div class="roleta-wrapper">
                    <div class="roleta" id="roleta">
                        <div class="roleta-ponteiro">▼</div>
                        <div class="roleta-center" id="roletaCenter">🎯</div>
                    </div>
                </div>

                <!-- ADICIONAR ITENS -->
                <div class="controls">
                    <input type="text" id="itemInput" placeholder="Digite uma opção..." />
                    <button class="btn btn-primary" id="addItemBtn">➕ Adicionar</button>
                </div>

                <!-- LISTA DE ITENS -->
                <ul class="item-list" id="itemList"></ul>

                <!-- BOTÕES DE AÇÃO -->
                <div class="controls">
                    <button class="btn btn-primary" id="spinBtn">🎰 GIRAR</button>
                    <button class="btn btn-outline" id="clearBtn">🗑️ Limpar Lista</button>
                </div>

                <!-- RESULTADO -->
                <div class="result-area" id="resultArea">
                    <span class="empty-message">Adicione itens e gire a roleta!</span>
                </div>

                <!-- HISTÓRICO -->
                <div class="historico-area" id="historicoArea">
                    <h4>📜 Histórico</h4>
                    <ul id="historicoList">
                        <li class="empty-message">Nenhum sorteio ainda.</li>
                    </ul>
                </div>

            </div>
        </div>
    </section>

    <!-- ============================================
    FOOTER
    ============================================ -->
    <footer role="contentinfo">
        <div class="container footer-content">
            <p>© 2026 Carlos · Roda da Sorte</p>
            <a href="../../abas/projetos.html" class="btn-voltar-footer">
                <i class="fas fa-arrow-left"></i> Voltar aos Projetos
            </a>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
