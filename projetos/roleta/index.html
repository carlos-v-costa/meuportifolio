<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Roda da Sorte - Cartoon Style" />
    <title>🎈 Roda Cartoon</title>

    <!-- FONTES -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- ============================================
    FUNDO CARTOON
    ============================================ -->
    <div class="bg-cartoon">
        <!-- Nuvens fofas -->
        <div class="cloud cloud-1"></div>
        <div class="cloud cloud-2"></div>
        <div class="cloud cloud-3"></div>
        <!-- Bolinhas coloridas -->
        <div class="bubble bubble-1"></div>
        <div class="bubble bubble-2"></div>
        <div class="bubble bubble-3"></div>
        <div class="bubble bubble-4"></div>
        <div class="bubble bubble-5"></div>
        <!-- Grama e flores -->
        <div class="grass"></div>
        <div class="flower flower-1">🌸</div>
        <div class="flower flower-2">🌼</div>
        <div class="flower flower-3">🌷</div>
        <div class="flower flower-4">🌻</div>
    </div>

    <!-- ============================================
    MENU SUPERIOR
    ============================================ -->
    <header class="header-cartoon">
        <div class="container">
            <div class="header-content">
                <a href="../../abas/projetos.html" class="btn-voltar-cartoon">← VOLTAR</a>
                <h1 class="title-cartoon">🎈 RODA CARTOON</h1>
                <span class="version-cartoon">v1.0</span>
            </div>
        </div>
    </header>

    <!-- ============================================
    CONTEÚDO PRINCIPAL
    ============================================ -->
    <main class="main-cartoon">
        <div class="container">

            <!-- CONTROLE DE SOM E MOEDAS -->
            <div class="sound-control-cartoon">
                <button id="soundToggle" class="btn-sound-cartoon">
                    🔊 <span id="soundStatus">LIGADO</span>
                </button>
                <div class="coin-counter-cartoon">
                    <span class="coin-icon">⭐</span>
                    <span class="coin-label">PONTOS:</span>
                    <span id="coinCounter" class="coin-value">0</span>
                </div>
            </div>

            <!-- TEMA -->
            <div class="theme-area-cartoon">
                <div class="theme-display-cartoon">
                    <span class="theme-label-cartoon">🎯 TEMA:</span>
                    <span class="theme-text-cartoon" id="currentTheme">CARTOON</span>
                </div>
            </div>

            <!-- ADICIONAR ITENS -->
            <div class="controls-cartoon">
                <input type="text" id="itemInput" placeholder="DIGITE UMA OPÇÃO..." maxlength="20" />
                <button class="btn-cartoon btn-add-cartoon" id="addItemBtn">+ ADICIONAR</button>
            </div>

            <!-- LISTA DE ITENS -->
            <ul class="item-list-cartoon" id="itemList"></ul>

            <!-- ROLETA -->
            <div class="roleta-wrapper-cartoon">
                <div class="roleta-border-cartoon" id="roletaBorder">
                    <div class="roleta" id="roleta">
                        <div class="roleta-ponteiro-cartoon">★</div>
                        <div class="roleta-center-cartoon" id="roletaCenter">🎈</div>
                        <div class="roleta-fatias" id="roletaFatias"></div>
                    </div>
                </div>
            </div>

            <!-- BOTÕES DE AÇÃO -->
            <div class="actions-cartoon">
                <button class="btn-cartoon btn-spin-cartoon" id="spinBtn">🎈 GIRAR</button>
                <button class="btn-cartoon btn-clear-cartoon" id="clearBtn">🗑️ LIMPAR</button>
            </div>

            <!-- RESULTADO -->
            <div class="result-cartoon" id="resultArea">
                <span class="empty-message-cartoon">► ADICIONE ITENS E GIRE ◄</span>
            </div>

            <!-- HISTÓRICO -->
            <div class="historico-cartoon" id="historicoArea">
                <h3>📜 HISTÓRICO</h3>
                <ul id="historicoList">
                    <li class="empty-message-cartoon">NENHUM SORTEIO AINDA.</li>
                </ul>
            </div>

        </div>
    </main>

    <!-- ============================================
    RODAPÉ
    ============================================ -->
    <footer class="footer-cartoon">
        <div class="container">
            <p>© 2026 CARLOS · RODA CARTOON</p>
            <p class="footer-credits-cartoon">★ FEITO COM CARINHO ★</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
