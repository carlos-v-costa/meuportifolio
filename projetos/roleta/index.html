<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Roda da Sorte 8-Bits" />
    <title>🎮 Roda 8-Bit</title>

    <!-- FONTE PIXELADA -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- SCANLINE -->
    <div class="scanline"></div>

    <!-- FUNDO 8-BITS -->
    <div class="bg-pixels"></div>

    <!-- ============================================
    MENU SUPERIOR
    ============================================ -->
    <header class="header-8bit">
        <div class="container">
            <div class="header-content">
                <a href="../../abas/projetos.html" class="btn-voltar">← VOLTAR</a>
                <h1 class="title-8bit">🎮 RODA 8-BIT</h1>
                <span class="version">v1.0</span>
            </div>
        </div>
    </header>

    <!-- ============================================
    ROLETA 8-BITS
    ============================================ -->
    <main class="main-8bit">
        <div class="container">

            <!-- CONTROLE DE SOM -->
            <div class="sound-control">
                <button id="soundToggle" class="btn-sound">
                    🔊 SOM: <span id="soundStatus">LIGADO</span>
                </button>
                <span class="spin-counter">🎮 GIROS: <span id="spinCounter">0</span></span>
            </div>

            <!-- TEMA -->
            <div class="theme-area">
                <label for="themeInput" class="theme-label">📌 TEMA:</label>
                <input type="text" id="themeInput" placeholder="EX: FILMES, JOGOS, COMIDAS..." maxlength="30" />
                <button class="btn-8bit btn-theme" id="setThemeBtn">DEFINIR TEMA</button>
            </div>

            <!-- TEMA ATUAL -->
            <div class="theme-display" id="themeDisplay">
                <span class="theme-text">TEMA: <span id="currentTheme">NENHUM</span></span>
            </div>

            <!-- ADICIONAR ITENS -->
            <div class="controls-8bit">
                <input type="text" id="itemInput" placeholder="DIGITE UMA OPÇÃO..." maxlength="20" />
                <button class="btn-8bit btn-add" id="addItemBtn">+ ADICIONAR</button>
            </div>

            <!-- LISTA DE ITENS -->
            <ul class="item-list-8bit" id="itemList"></ul>

            <!-- ROLETA VISUAL -->
            <div class="roleta-wrapper">
                <div class="roleta" id="roleta">
                    <!-- PONTEIRO FIXO (SETA NA PARTE SUPERIOR) -->
                    <div class="roleta-ponteiro-8bit">▼</div>
                    <!-- CENTRO DA ROLETA -->
                    <div class="roleta-center-8bit" id="roletaCenter">🎯</div>
                    <!-- FATIAS DA ROLETA (GERADAS POR JS) -->
                    <div class="roleta-fatias" id="roletaFatias"></div>
                </div>
            </div>

            <!-- BOTÕES DE AÇÃO -->
            <div class="actions-8bit">
                <button class="btn-8bit btn-spin" id="spinBtn">🎮 GIRAR</button>
                <button class="btn-8bit btn-clear" id="clearBtn">🗑️ LIMPAR</button>
            </div>

            <!-- RESULTADO -->
            <div class="result-8bit" id="resultArea">
                <span class="empty-message">► ADICIONE ITENS E GIRE ◄</span>
            </div>

            <!-- HISTÓRICO -->
            <div class="historico-8bit" id="historicoArea">
                <h3>📜 HISTÓRICO</h3>
                <ul id="historicoList">
                    <li class="empty-message">NENHUM SORTEIO AINDA.</li>
                </ul>
            </div>

        </div>
    </main>

    <!-- ============================================
    RODAPÉ
    ============================================ -->
    <footer class="footer-8bit">
        <div class="container">
            <p>© 2026 CARLOS · RODA 8-BIT</p>
            <p class="footer-credits">⚡ POWERED BY NOSTALGIA</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
